# Configuration for Verso's literate-HTML site (`lake build :literateHtml`).
# Top-level keys must come before any `[table]` or `[[array]]` header.

hide_commands = ["import", "open", "variable", "section", "end", "namespace", "set_option", "public section"]
docstrings_as_text = true
extra_css = ["site/cookbook.css"]
extra_js = ["site/cookbook.js"]
landing_page = "MatrixCookbook.«1Basic»"

# Chapters are published as they are converted; add each one here, and to `order_children` below.
[[targets]]
module = "MatrixCookbook.«1Basic»"

[[targets]]
module = "MatrixCookbook.«2Derivatives»"

[[targets]]
module = "MatrixCookbook.«3Inverses»"

[[targets]]
