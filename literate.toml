[[targets]]
module = "MatrixCookbook.«5SolutionsAndDecompositions»"

[[targets]]
module = "MatrixCookbook.«6StatisticsAndProbability»"

[[targets]]
module = "MatrixCookbook.«7MultivariateDistributions»"

[[targets]]
module = "MatrixCookbook.«8Gaussians»"

[[targets]]
module = "MatrixCookbook.«9SpecialMatrices»"

