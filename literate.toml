# Configuration for Verso's literate-HTML site (`lake build :literateHtml`).
# Top-level keys must come before any `[table]` or `[[array]]` header.

hide_commands = ["import", "open", "variable", "section", "end", "namespace", "set_option", "public section"]
docstrings_as_text = true
extra_css = ["site/cookbook.css"]
extra_js = ["site/cookbook.js"]
landing_page = "MatrixCookbook.«1Basic»"

# Chapters are published as they are converted; add each one here, and to `order_children` below.
[[targets]]
module = "MatrixCookbook.«1Basic»"

[[targets]]
module = "MatrixCookbook.«2Derivatives»"

[metadata]
title = "The Matrix Cookbook, in Lean"
description = "The identities of The Matrix Cookbook (Petersen & Pedersen, 2012), stated and proved with Mathlib."

[modules."MatrixCookbook"]
title = "The Matrix Cookbook"
url = "/"

[modules."MatrixCookbook.«1Basic»"]
title = "1 Basics"
url = "basics"

[modules."MatrixCookbook.«2Derivatives»"]
title = "2 Derivatives"
url = "derivatives"

# Module names sort as text ("10…" before "2…"), so list the chapters in order.
[order_children]
"MatrixCookbook" = ["MatrixCookbook.«1Basic»", "MatrixCookbook.«2Derivatives»"]
